<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d13"/>
      <stop offset=".55" stop-color="#0a0a0e"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <radialGradient id="redGlow" cx=".78" cy=".12" r=".55">
      <stop offset="0" stop-color="#ef233c" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#ef233c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ef233c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx=".08" cy=".88" r=".5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerShade" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#09090b" stop-opacity=".58"/>
      <stop offset=".7" stop-color="#09090b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="softBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#redGlow)"/>
  <rect width="1600" height="900" fill="url(#blueGlow)"/>

  <!-- soft glow orbs -->
  <circle cx="1280" cy="110" r="150" fill="#ef233c" opacity=".16" filter="url(#softBig)"/>
  <circle cx="140" cy="790" r="130" fill="#2f6bff" opacity=".14" filter="url(#softBig)"/>

  <!-- circuit traces (left, red) -->
  <g fill="none" stroke="#ff5a6e" stroke-width="1.6" opacity=".55">
    <path d="M60 260 H210 L260 310 H420 L470 360 H640"/>
    <path d="M60 330 H170 L230 390 H380"/>
    <path d="M60 430 H150 L200 480 H300 L350 530"/>
  </g>
  <g fill="#ff5a6e" opacity=".8">
    <circle cx="60" cy="260" r="3.5"/><circle cx="260" cy="310" r="3.5"/>
    <circle cx="470" cy="360" r="3.5"/><circle cx="640" cy="360" r="3.5"/>
    <circle cx="60" cy="330" r="3.5"/><circle cx="230" cy="390" r="3.5"/>
    <circle cx="60" cy="430" r="3.5"/><circle cx="200" cy="480" r="3.5"/>
  </g>

  <!-- circuit traces (right, blue) -->
  <g fill="none" stroke="#5aa2ff" stroke-width="1.6" opacity=".5">
    <path d="M1540 300 H1390 L1340 350 H1180 L1130 400 H980"/>
    <path d="M1540 420 H1440 L1380 480 H1240"/>
    <path d="M1540 560 H1450 L1400 610 H1290 L1240 660"/>
  </g>
  <g fill="#5aa2ff" opacity=".8">
    <circle cx="1540" cy="300" r="3.5"/><circle cx="1340" cy="350" r="3.5"/>
    <circle cx="1130" cy="400" r="3.5"/><circle cx="1540" cy="420" r="3.5"/>
    <circle cx="1380" cy="480" r="3.5"/><circle cx="1540" cy="560" r="3.5"/>
    <circle cx="1400" cy="610" r="3.5"/>
  </g>

  <!-- chip outlines -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.4">
    <rect x="108" y="640" width="86" height="86" rx="8"/>
    <rect x="122" y="654" width="58" height="58" rx="5"/>
    <rect x="1408" y="120" width="86" height="86" rx="8"/>
    <rect x="1422" y="134" width="58" height="58" rx="5"/>
  </g>

  <!-- small plus marks -->
  <g stroke="#ffffff" stroke-opacity=".18" stroke-width="1.4">
    <path d="M700 700 h18 M709 691 v18"/>
    <path d="M980 760 h18 M989 751 v18"/>
    <path d="M420 180 h18 M429 171 v18"/>
    <path d="M1180 220 h18 M1189 211 v18"/>
  </g>

  <!-- centre shade so text stays readable -->
  <rect width="1600" height="900" fill="url(#centerShade)"/>
</svg>
